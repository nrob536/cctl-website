<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Catalogue - Carterton Community Toy Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="library-name">Carterton Community Toy Library</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="my-bookings.html">My Bookings</a>
    </nav>
  </header>

  <div class="container" x-data="catalogue()" x-init="init()">
    <h2>Browse Toys</h2>

    <div class="filters">
      <div class="filter-group">
        <label for="display-limit-filter">Toys to display:</label>
        <select id="display-limit-filter" x-model.number="displayLimit" @change="onDisplayLimitChange()">
          <template x-for="size in displayLimitOptions" :key="size">
            <option :value="size" x-text="size"></option>
          </template>
        </select>
      </div>
    </div>

    <div class="catalogue-status" x-show="!loading && toys.length > 0">
      <p>Showing <span x-text="toys.length"></span> available toys in a balanced sample across categories.</p>
    </div>

    <div class="message message-info" x-show="warningMessage">
      <p x-text="warningMessage"></p>
    </div>

    <div class="message message-error" x-show="errorMessage">
      <p x-text="errorMessage"></p>
    </div>

    <div class="loading" x-show="loading">
      <div class="spinner"></div>
      <p>Loading toys...</p>
    </div>

    <div class="toys-grid" x-show="!loading && toys.length > 0">
      <template x-for="toy in toys" :key="toy.id">
        <div class="toy-card">
          <img src="images/placeholder.png" alt="Toy image" :src="toy.image_url || 'images/placeholder.png'" :alt="toy.name || 'Toy name'" onerror="this.src='images/placeholder.png'">
          <div class="toy-card-content">
            <h3 x-text="toy.name">Toy name</h3>
            <div class="toy-card-meta">
              <strong>Age Range:</strong> <span x-text="toy.age_range"></span>
            </div>
            <span class="toy-card-category" x-text="toy.category || 'Uncategorised'"></span>
            <br>
            <span class="badge-available" x-show="toy.available">Available</span>
            <br>
            <a class="toy-card-link" :href="'toy.html?id=' + toy.id">View Details</a>
          </div>
        </div>
      </template>
    </div>

    <div x-show="!loading && toys.length === 0 && !warningMessage && !errorMessage" class="message message-info">
      <p>No toys are available to display right now. Please try again later.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/catalogue.js"></script>
</body>
</html>
